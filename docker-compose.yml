services:
  db:
    image: postgres:16-alpine
    container_name: settlement-postgres
    environment:
      POSTGRES_DB: settlement
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: settlement-engine
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/settlement
      SPRING_DATASOURCE_USERNAME: settlement
      SPRING_DATASOURCE_PASSWORD: settlement_dev
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  postgres_data:
