# ============================================================
#  MoveInSync Vendor & Driver Settlement Engine
#  Docker Compose — Local Development Environment
#
#  Services:
#    • db  — PostgreSQL 16 with persistent volume
#    • app — Settlement Engine Spring Boot application
#
#  Usage:
#    docker compose up -d            # Start everything
#    docker compose up db -d         # Start only the DB (for local dev with ./mvnw spring-boot:run)
#    docker compose logs -f app      # Follow application logs
#    docker compose down -v          # Stop and remove volumes
# ============================================================

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: settlement-postgres
    environment:
      POSTGRES_DB: settlement
      POSTGRES_USER: settlement
      POSTGRES_PASSWORD: settlement_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U settlement -d settlement"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Settlement Engine Application ──────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: settlement-engine
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/settlement
      SPRING_DATASOURCE_USERNAME: settlement
      SPRING_DATASOURCE_PASSWORD: settlement_dev
      SERVER_PORT: 8080
      # Override JWT_SECRET with a secure 256-bit hex key in production:
      #   openssl rand -hex 32
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
