server:
  port: 8081

spring:
  application:
    name: settlement-engine

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/settlement}
    username: ${SPRING_DATASOURCE_USERNAME:settlement}
    password: ${SPRING_DATASOURCE_PASSWORD:settlement_dev}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# JWT Configuration (Externalized to env vars with safe dev defaults)
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{traceId:-NONE}] [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.moveinsync.settlement: INFO


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

settlement:
  stale-run:
    check-interval-ms: 900000
    cutoff-minutes: 30
    initial-delay-ms: 60000
  outbox:
    poll-interval-ms: 5000
